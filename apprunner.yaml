version: 1.0

# ── Build ────────────────────────────────────────────────────
build:
  runtime: corretto17
  build-command: mvn clean package -DskipTests
  start-command: java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom -jar target/btg-pactual-1.0.0.jar
  runtime-version: latest

# ── Run ──────────────────────────────────────────────────────
run:
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: "prod"
