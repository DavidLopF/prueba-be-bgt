version: 1.0
runtime: corretto17

build:
  commands:
    build:
      - mvn clean package -Dmaven.test.skip=true

run:
  command: java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom -jar target/btg-pactual-1.0.0.jar
  network:
    port: 8080
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: "prod"
