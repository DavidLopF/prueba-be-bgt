# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=BTG-Pactual

# ── MongoDB ───────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/btgpactual}
spring.data.mongodb.database=${MONGODB_DB:btgpactual}

# ── JWT ───────────────────────────────────────────────────────────────────────
# Secret debe tener mínimo 32 caracteres (256 bits) para HS256
jwt.secret=${JWT_SECRET:BTGPactual-Fondos-JWT-Secret-Key-2024!!}
# Expiración en milisegundos: 86400000 = 24 horas
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.enterprise.btgpactual=DEBUG
logging.level.org.springframework.security=INFO
